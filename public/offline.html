<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Along is offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #fff; color: #222; }
      main { max-width: 320px; padding: 32px; text-align: center; }
      i { width: 58px; height: 58px; margin: auto; border-radius: 18px; display: grid; place-items: center; background: #e96562; color: #fff; font-style: normal; font-weight: 800; font-size: 24px; transform: rotate(-5deg); }
      h1 { margin: 28px 0 10px; font-size: 28px; letter-spacing: -.04em; }
      p { margin: 0; color: #717171; line-height: 1.55; }
      button { margin-top: 24px; min-height: 50px; padding: 0 24px; border: 0; border-radius: 16px; background: #222; color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <main><i>A</i><h1>You’re offline</h1><p>Along will reconnect as soon as your network is back.</p><button onclick="location.reload()">Try again</button></main>
  </body>
</html>
